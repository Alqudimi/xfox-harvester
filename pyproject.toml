[project]
name = "xfox-harvester"
version = "1.0.0"
description = "XFox Harvester — a production-grade orchestration platform around X-CrawlFox for harvesting X (Twitter) posts safely, with anti-ban governance, multi-account pooling, scheduling, and a full bilingual web console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "XFox Harvester" }]
keywords = ["x", "twitter", "crawler", "x-crawlfox", "camoufox", "harvester"]

dependencies = [
    # --- Web layer ---
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.1",
    # --- Data layer ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # --- Validation & settings ---
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    # --- Auth ---
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.2.1",
    # --- Engine ---
    "x-crawlfox>=0.1.2",
    "loguru>=0.7.3",
    # --- Utilities ---
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.6",
]

[project.scripts]
xfox = "xfox.main:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xfox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PL"]
ignore = [
    "PLR0913",  # FastAPI handlers legitimately take many injected dependencies
    "PLR0917",  # FastAPI query-param handlers and policy functions read better flat
    "PLR0911",  # eligibility/health state machines use one return per explicit reason
    "PLR2004",  # policy thresholds are documented domain constants in tests
    "PLC0415",  # deliberate lazy imports break circular deps (events/orchestrator)
    "PLW0603",  # module-level singletons (engine, db) are intentional
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # X-CrawlFox log fixtures must stay verbatim
